<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTER-BOX — Powitanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   INTER-BOX — ekran powitalny na telewizor w wejściu (wersja 4.3 — ikony pogody bez przycięć)
   Układ 1920×1080, skalowany automatycznie do rozmiaru ekranu.
   ===================================================================== */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06080b; cursor: none; }
* { box-sizing: border-box; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  transform-origin: 0 0; -webkit-transform-origin: 0 0;
  font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #f2f5f8;
  background:
    radial-gradient(1100px 760px at 8% 0%, rgba(38, 56, 74, .55) 0%, rgba(38, 56, 74, 0) 70%),
    radial-gradient(900px 700px at 100% 100%, rgba(22, 92, 66, .30) 0%, rgba(22, 92, 66, 0) 65%),
    linear-gradient(160deg, #0d1218 0%, #090c10 55%, #070a0d 100%);
  transition: transform 4s ease; -webkit-transition: -webkit-transform 4s ease;
}
/* subtelna siatka linii w tle — nawiązanie do paskowego logo */
#lines { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: .5; }
#bigmark {
  position: absolute; width: 900px; right: 400px; top: 160px; opacity: .028;
  animation: breathe 14s ease-in-out infinite; -webkit-animation: breathe 14s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .022; } 50% { opacity: .045; } }
@-webkit-keyframes breathe { 0%,100% { opacity: .022; } 50% { opacity: .045; } }

/* ---------- nagłówek ---------- */
#logo { position: absolute; left: 96px; top: 70px; height: 104px; }
#clock { position: absolute; right: 96px; top: 52px; text-align: right; }
#time { font-size: 104px; font-weight: 300; letter-spacing: -2px; line-height: 1; }
#time .colon { opacity: .55; padding: 0 2px; }
#date { margin-top: 12px; font-size: 30px; font-weight: 400; color: #9aabbb; letter-spacing: .5px; }
#date b { color: #dfe7ee; font-weight: 600; }

/* ---------- lewa kolumna ---------- */
#left { position: absolute; left: 96px; top: 262px; width: 1040px; }
.kicker { white-space: nowrap; overflow: hidden; font-size: 24px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: #8fa1b2; }
.kicker:before { content: ''; display: inline-block; width: 46px; height: 3px; background: #35d28a; vertical-align: middle; margin: -4px 20px 0 0; border-radius: 2px; }
#greet { white-space: nowrap; margin-top: 20px; font-size: 136px; font-weight: 800; line-height: 1; letter-spacing: -3px; }
#greet span { color: #35d28a; }
#sub { margin-top: 24px; font-size: 34px; font-weight: 300; color: #b9c6d2; line-height: 1.35; max-width: 980px; }

/* ---------- licznik dni bez wypadku ---------- */
#safety { position: absolute; left: 96px; top: 600px; width: 1000px; height: 360px; }
#ring { position: absolute; left: 0; top: 0; width: 360px; height: 360px; }
#ring svg { width: 360px; height: 360px; display: block; }
#ringNum { position: absolute; left: 0; top: 0; width: 360px; height: 360px; text-align: center; }
#days { display: block; font-weight: 800; color: #ffffff; line-height: 1; letter-spacing: -4px; margin-top: 96px; }
#daysUnit { display: block; margin-top: 8px; font-size: 30px; font-weight: 600; color: #35d28a; letter-spacing: .2em; text-transform: uppercase; }
#safeText { position: absolute; left: 420px; top: 40px; width: 640px; }
#safeTitle { font-size: 66px; font-weight: 800; line-height: 1.02; letter-spacing: -1px; white-space: nowrap; }
#safeTitle small { display: block; overflow: hidden; font-size: 22px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #8fa1b2; margin-bottom: 16px; }
.facts { margin-top: 26px; }
.fact { overflow: hidden; font-size: 27px; color: #aebccb; margin-top: 14px; font-weight: 400; white-space: nowrap; }
.fact b { color: #eef3f7; font-weight: 600; }
.fact i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #35d28a; margin-right: 18px; vertical-align: middle; margin-top: -4px; }
.fact i.g { background: #4a5a6a; }
#badge { display: none; margin-top: 22px; font-size: 26px; font-weight: 700; color: #0a0d11; background: #35d28a; padding: 10px 22px; border-radius: 40px; }

/* ---------- pogoda ---------- */
#weather {
  position: absolute; left: 1180px; top: 252px; width: 644px; height: 720px; padding: 42px 48px;
  background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .075); border-radius: 36px;
}
#wHead { overflow: hidden; }
#wHead .kicker { float: left; max-width: 240px; }
#wPlace { float: right; max-width: 300px; white-space: nowrap; overflow: hidden; font-size: 24px; color: #8fa1b2; font-weight: 500; margin-top: -1px; }
#wNow { position: relative; height: 196px; margin-top: 18px; }
#wIcon { position: absolute; left: -14px; top: -4px; width: 200px; height: 200px; }
#wTemp { position: absolute; left: 210px; top: 6px; font-size: 136px; font-weight: 300; letter-spacing: -5px; line-height: 1; }
#wTemp sup { font-size: 70px; vertical-align: top; position: relative; top: 8px; letter-spacing: 0; color: #9aabbb; }
#wDesc { position: absolute; left: 216px; top: 148px; width: 332px; overflow: hidden; font-size: 30px; font-weight: 500; color: #dfe7ee; white-space: nowrap; }
#wDetails { margin-top: 18px; font-size: 22px; color: #8fa1b2; white-space: nowrap; }
#wDetails b { color: #dfe7ee; font-weight: 600; }
#wDetails .sep { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #3c4a58; margin: 0 14px; vertical-align: middle; margin-top: -3px; }
.hr { height: 1px; background: rgba(255, 255, 255, .08); margin: 28px 0 22px; }
#wHours { overflow: hidden; }
.hour { float: left; width: 91px; text-align: center; }
.hour .t { font-size: 21px; color: #8fa1b2; }
.hour .ic { width: 58px; height: 58px; margin: 6px auto 2px; }
.hour .v { font-size: 27px; font-weight: 600; }
.day { overflow: hidden; height: 58px; line-height: 58px; }
.day .n { float: left; width: 190px; font-size: 26px; font-weight: 600; }
.day .ic { float: left; width: 50px; height: 50px; margin-top: 4px; }
.day .d { float: left; margin-left: 18px; font-size: 22px; color: #8fa1b2; width: 210px; white-space: nowrap; overflow: hidden; }
.day .mm { float: right; font-size: 26px; font-weight: 600; }
.day .mm span { color: #6f8091; font-weight: 400; margin-left: 12px; }
#wErr { display: none; position: absolute; left: 48px; right: 48px; top: 300px; text-align: center; font-size: 26px; color: #8fa1b2; }

/* ---------- stopka ---------- */
#foot { position: absolute; left: 96px; right: 96px; bottom: 44px; height: 40px; }
#msg { position: absolute; left: 0; bottom: 0; max-width: 1060px; padding-left: 46px; font-size: 27px; line-height: 1.3; font-weight: 500; color: #c9d4de; transition: opacity 1s; -webkit-transition: opacity 1s; }
#msg svg { position: absolute; left: 0; bottom: 4px; width: 30px; height: 30px; }
#upd { position: absolute; right: 0; top: 6px; font-size: 19px; color: #5f7081; }

/* ---------- przyciemnienie nocne ---------- */
#dim { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 6s; -webkit-transition: opacity 6s; }

/* ---------- animacje ---------- */
.rise { opacity: 0; animation: rise 1.2s ease forwards; -webkit-animation: rise 1.2s ease forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translateY(26px); } to { opacity: 1; -webkit-transform: none; } }
.spin { animation: spin 60s linear infinite; -webkit-animation: spin 60s linear infinite; transform-origin: 32px 32px; -webkit-transform-origin: 32px 32px; }
@keyframes spin { to { transform: rotate(360deg); } }
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
.drop { animation: drop 1.4s linear infinite; -webkit-animation: drop 1.4s linear infinite; }
@keyframes drop { 0% { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(7px); opacity: 0; } }
@-webkit-keyframes drop { 0% { -webkit-transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { -webkit-transform: translateY(7px); opacity: 0; } }
.drift { animation: drift 9s ease-in-out infinite; -webkit-animation: drift 9s ease-in-out infinite; }
@keyframes drift { 0%,100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
@-webkit-keyframes drift { 0%,100% { -webkit-transform: translateX(-1.5px); } 50% { -webkit-transform: translateX(1.5px); } }
.pulse { animation: pulse 1.6s ease; -webkit-animation: pulse 1.6s ease; }
@keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 100% { transform: scale(1); } }
@-webkit-keyframes pulse { 0% { -webkit-transform: scale(1); } 30% { -webkit-transform: scale(1.12); } 100% { -webkit-transform: scale(1); } }
</style>
</head>

    var c = j.current, wi = wInfo(c.weather_code);
    $('wErr').style.display = 'none';
    $('wIcon').innerHTML = icon(wi[1], c.is_day === 1, true);
    $('wTemp').innerHTML = Math.round(c.temperature_2m) + '<sup>°C</sup>';
    $('wDesc').innerHTML = wi[0];
    fitW('wDesc', 30, 16);
    var sr = j.daily.sunrise[0].slice(11, 16), ss = j.daily.sunset[0].slice(11, 16);
    $('wDetails').innerHTML = esc(T('odczuwalna')) + ' <b>' + Math.round(c.apparent_temperature) + '°</b><span class="sep"></span>' + esc(T('wiatr')) + ' <b>' + Math.round(c.wind_speed_10m) + ' km/h</b><span class="sep"></span>' + esc(T('wilgotnosc')) + ' <b>' + Math.round(c.relative_humidity_2m) + '%</b>';
    // godziny
    var hk = nowHourKey(), idx = j.hourly.time.indexOf(hk), h = '';
    if (idx < 0) idx = 0;
    for (var k = 0; k < 6; k++) {
      var ii = idx + 1 + k * 2; if (ii >= j.hourly.time.length) break;
      var hw = wInfo(j.hourly.weather_code[ii]);
      h += '<div class="hour"><div class="t">' + j.hourly.time[ii].slice(11, 16) + '</div><div class="ic">' + icon(hw[1], j.hourly.is_day[ii] === 1, false) + '</div><div class="v">' + Math.round(j.hourly.temperature_2m[ii]) + '°</div></div>';
    }
    $('wHours').innerHTML = h;
    // dni
    var d = '';
    for (var q = 1; q <= 3 && q < j.daily.time.length; q++) {
      var dw = wInfo(j.daily.weather_code[q]), dd = parseD(j.daily.time[q]);
      var name = q === 1 ? esc(T('jutro')) : DNI_D[new Date(dd.y, dd.m - 1, dd.d).getDay()];
      d += '<div class="day"><div class="n">' + name + '</div><div class="ic">' + icon(dw[1], true, false) + '</div><div class="d">' + dw[0] + '</div><div class="mm">' + Math.round(j.daily.temperature_2m_max[q]) + '°<span>' + Math.round(j.daily.temperature_2m_min[q]) + '°</span></div></div>';
    }
    $('wDays').innerHTML = d;
    var f = new Date(fetchedAt);
    wUpd = esc(T('wschod')) + ' ' + sr + ' · ' + esc(T('zachod')) + ' ' + ss + ' · ' + esc(T('pogodaZ')) + ' ' + p2(f.getHours()) + ':' + p2(f.getMinutes()); wErrTxt = '';
    drawUpd();
  }

  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.szerokosc + '&longitude=' + CONFIG.dlugosc +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day' +
      '&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset' +
      '&timezone=Europe%2FWarsaw&forecast_days=4&wind_speed_unit=kmh';
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 30000;
    x.onload = function () {
      if (x.status !== 200) return fail();
      try {
        var j = JSON.parse(x.responseText), t = Date.now();
        renderWeather(j, t);
        sset('ib_weather', JSON.stringify({ t: t, j: j }));
      } catch (e) { fail(); }
    };
    x.onerror = x.ontimeout = fail;
    try { x.send(); } catch (e) { fail(); }
    function fail() {
      if (!$('wHours').innerHTML) { $('wErr').style.display = 'block'; $('wErr').innerHTML = 'Brak połączenia z serwisem pogody.<br>Spróbujemy ponownie za chwilę.'; setTimeout(loadWeather, 60000); }
      else { wErrTxt = 'pogoda: brak połączenia'; drawUpd(); }
    }
  }
  (function () { // pokaż ostatnią zapisaną pogodę od razu (jeśli nie starsza niż 3 h)
    var s = sget('ib_weather');
    if (s) { try { var o = JSON.parse(s); if (Date.now() - o.t < 3 * 3600000) renderWeather(o.j, o.t); } catch (e) {} }
  })();

  /* ---------- start ---------- */
  renderTexts(); tickClock(); rotateSub(); rotateMsg();
  renderSafety(true);
  loadSheet();
  loadWeather();
  setInterval(tickClock, 1000);
  setInterval(rotateSub, 20000);
  setInterval(rotateMsg, 12000);
  setInterval(function () { renderSafety(false); }, 30000); // o północy licznik sam rośnie
  setInterval(loadSheet, CONFIG.arkuszCoMinut * 60000);
  setInterval(loadWeather, CONFIG.pogodaCoMinut * 60000);

  window.addEventListener('load', fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  setTimeout(fitAll, 3000);
  setInterval(fitAll, 60000);

  // do testów z konsoli
  window.IBTV = { config: CONFIG, renderWeather: renderWeather, fitAll: fitAll, tickClock: tickClock, renderSafety: renderSafety, loadWeather: loadWeather, loadSheet: loadSheet, applySheet: applySheet, parseAnyDate: parseAnyDate, daysNow: daysNow };
})();
</script>
</body>
</html>
